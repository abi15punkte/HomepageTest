<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partikel</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="particle-stage"><canvas id="c"></canvas></main><div class="hint">Maus bewegen · klicken zum Auflösen</div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),img=new Image();img.src='IMG_0030.jpeg';let pts=[],mouse={x:-1e4,y:-1e4};function resize(){c.width=innerWidth;c.height=innerHeight;make()}function make(){if(!img.complete)return;const s=Math.min(1,1200/img.width),w=img.width*s,h=img.height*s,ox=(c.width-w)/2,oy=(c.height-h)/2;const oc=document.createElement('canvas'),q=oc.getContext('2d');oc.width=w;oc.height=h;q.drawImage(img,0,0,w,h);const d=q.getImageData(0,0,w,h).data;pts=[];for(let yy=0;yy<h;yy+=7)for(let xx=0;xx<w;xx+=7){const i=(yy*w+xx)*4;pts.push({x:ox+xx,y:oy+yy,tx:ox+xx,ty:oy+yy,r:d[i],g:d[i+1],b:d[i+2],vx:0,vy:0})}}function draw(){x.fillStyle='rgba(5,5,5,.18)';x.fillRect(0,0,c.width,c.height);for(const p of pts){const dx=p.x-mouse.x,dy=p.y-mouse.y,dist=Math.hypot(dx,dy),f=Math.max(0,1-dist/180);p.vx+=dx/dist*f*1.7;p.vy+=dy/dist*f*1.7;p.vx+=(p.tx-p.x)*.018;p.vy+=(p.ty-p.y)*.018;p.vx*=.88;p.vy*=.88;p.x+=p.vx;p.y+=p.vy;x.fillStyle='rgb('+p.r+','+p.g+','+p.b+')';x.fillRect(p.x,p.y,3,3)}requestAnimationFrame(draw)}img.onload=resize;addEventListener('resize',resize);addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('pointerleave',()=>{mouse.x=-1e4;mouse.y=-1e4});addEventListener('click',()=>{for(const p of pts){p.vx+=(Math.random()-.5)*14;p.vy+=(Math.random()-.5)*14}});draw();</script></body></html>
