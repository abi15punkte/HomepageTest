<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebGL Displacement</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="webgl-stage"><canvas id="c"></canvas></main><div class="hint">Maus bewegen · auf Touch: Finger bewegen</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const canvas=document.querySelector('#c'),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const loader=new THREE.TextureLoader();const tex=loader.load('IMG_0030.jpeg');const geo=new THREE.PlaneGeometry(2,2,120,120);const mat=new THREE.ShaderMaterial({uniforms:{uTex:{value:tex},uMouse:{value:new THREE.Vector2(.5,.5)},uTime:{value:0}},vertexShader:`uniform vec2 uMouse;uniform float uTime;varying vec2 vUv;void main(){vUv=uv;vec3 p=position;float d=distance(uv,uMouse);p.z+=.18*sin(d*28.0-uTime*2.0)*(1.0-smoothstep(0.0,.65,d));gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,fragmentShader:`uniform sampler2D uTex;uniform vec2 uMouse;uniform float uTime;varying vec2 vUv;void main(){vec2 uv=vUv;float d=distance(uv,uMouse);uv.x+=.035*sin(d*32.0-uTime*2.2)*(1.0-smoothstep(0.0,.75,d));uv.y+=.02*cos(d*25.0-uTime*1.8)*(1.0-smoothstep(0.0,.7,d));gl_FragColor=texture2D(uTex,uv);}`});scene.add(new THREE.Mesh(geo,mat));let target=new THREE.Vector2(.5,.5);addEventListener('pointermove',e=>target.set(e.clientX/innerWidth,1-e.clientY/innerHeight));function resize(){renderer.setSize(innerWidth,innerHeight,false)}addEventListener('resize',resize);resize();function loop(t){mat.uniforms.uTime.value=t*.001;mat.uniforms.uMouse.value.lerp(target,.08);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
