<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Playback</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="back" href="index.html">← Übersicht</a>

<main class="demo">
  <section class="video-playback">
    <video
      class="playback-video"
      src="TestVideo.mp4"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>

    <div class="caption playback-caption">
      <p>07 / Video-Playback</p>
      <h1>Play = Video.</h1>
      <p>Das Video wird einfach automatisch abgespielt.</p>
    </div>
  </section>
</main>
</body>
</html>
