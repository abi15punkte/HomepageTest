<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Scrub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="back" href="index.html">← Übersicht</a>

<main class="demo">
  <section class="video-track" id="video-track">
    <div class="video-sticky">
      <video id="scrub-video" class="scrub-video" src="IMG_0041.mp4" preload="auto" muted playsinline webkit-playsinline></video>
      <div class="caption video-caption">
        <p>06 / Video-Scrub</p>
        <h1>Scroll = Video.</h1>
        <p>Die Scrollposition steuert direkt die Zeitachse des Videos.</p>
      </div>
      <div class="video-progress"><span id="video-progress"></span></div>
    </div>
  </section>
</main>

<div class="hint">Scrollen</div>

<script>
const track=document.querySelector('#video-track');
const video=document.querySelector('#scrub-video');
const progress=document.querySelector('#video-progress');
const caption=document.querySelector('.video-caption');

let duration=0;
let targetTime=0;
let seeking=false;
let raf=0;

function clamp(v,a=0,b=1){return Math.min(b,Math.max(a,v))}
function smooth(t){return t*t*(3-2*t)}

function readScroll(){
  const max=Math.max(1,track.offsetHeight-innerHeight);
  const rect=track.getBoundingClientRect();
  const p=clamp(-rect.top/max);

  targetTime=duration*p;
  progress.style.width=(p*100)+'%';

  const fade=clamp((p-.76)/.24);
  caption.style.opacity=1-fade;
  caption.style.transform='translate3d(0,'+(-24*smooth(p))+'px,0)';

  if(!raf) raf=requestAnimationFrame(processSeek);
}

function processSeek(){
  raf=0;
  if(!duration || seeking) return;

  const delta=targetTime-video.currentTime;
  if(Math.abs(delta)<0.02) return;

  seeking=true;

  try{
    if(typeof video.fastSeek==='function'){
      video.fastSeek(targetTime);
    }else{
      video.currentTime=targetTime;
    }
  }catch(e){
    video.currentTime=targetTime;
  }
}

function finishSeek(){
  seeking=false;
  if(Math.abs(targetTime-video.currentTime)>0.02){
    if(!raf) raf=requestAnimationFrame(processSeek);
  }
}

video.addEventListener('loadedmetadata',()=>{
  duration=Number.isFinite(video.duration)?video.duration:0;
  readScroll();
});

video.addEventListener('seeked',finishSeek);

video.muted=true;
video.playsInline=true;
video.preload='auto';

addEventListener('scroll',readScroll,{passive:true});
addEventListener('resize',readScroll);

readScroll();
</script>
</body>
</html>
