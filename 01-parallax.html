<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parallax</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="demo"><section class="parallax-track" id="parallax-track"><div class="parallax-sticky"><img id="photo" class="photo parallax-photo" src="IMG_0030.jpeg" alt=""><div class="caption"><p>01 / Parallax</p><h1>Bewegung<br>durch Tiefe</h1><p>Das Foto bleibt im Viewport. Mehrstufige Kamerafahrt: Zielpunkt 70 / 70, bis 10× Zoom.</p></div></div></section></main><div class="hint">Scrollen</div><script>
const track=document.querySelector('#parallax-track');
const img=document.querySelector('#photo');
const caption=document.querySelector('.caption');

const stages=[
  {at:0.00,x:50,y:25,scale:1.15},
  {at:0.22,x:42,y:35,scale:2.0},
  {at:0.48,x:55,y:48,scale:4.0},
  {at:0.72,x:63,y:58,scale:7.0},
  {at:1.00,x:70,y:70,scale:10.0}
];

const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function stateAt(p){
  for(let i=0;i<stages.length-1;i++){
    const a=stages[i],b=stages[i+1];
    if(p<=b.at){
      const local=(p-a.at)/(b.at-a.at);
      const e=ease(Math.max(0,Math.min(1,local)));
      return {
        x:a.x+(b.x-a.x)*e,
        y:a.y+(b.y-a.y)*e,
        scale:a.scale+(b.scale-a.scale)*e
      };
    }
  }
  return stages[stages.length-1];
}

function update(){
  const max=Math.max(1,track.offsetHeight-innerHeight);
  const rect=track.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,-rect.top/max));
  const s=stateAt(p);

  const tx=innerWidth/2-(s.x/100)*innerWidth*s.scale;
  const ty=innerHeight/2-(s.y/100)*innerHeight*s.scale;

  img.style.transform='translate3d('+tx+'px,'+ty+'px,0) scale('+s.scale+')';
  caption.style.transform='translate3d(0,'+(-20*p)+'px,0)';
}

addEventListener('scroll',update,{passive:true});
addEventListener('resize',update);
update();
</script></body></html>
