<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parallax</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="demo"><section class="parallax-track" id="parallax-track"><div class="parallax-sticky"><img id="photo" class="photo parallax-photo" src="IMG_0030.jpeg" alt=""><div class="caption"><p>01 / Parallax</p><h1>Bewegung<br>durch Tiefe</h1><p>Das Foto bleibt im Viewport. Der Zoom ist deutlich verstärkt.</p></div></div></section></main><div class="hint">Scrollen</div><script>const track=document.querySelector('#parallax-track');const img=document.querySelector('#photo');const caption=document.querySelector('.caption');function update(){const max=track.offsetHeight-innerHeight;const rect=track.getBoundingClientRect();const p=max>0?Math.min(1,Math.max(0,-rect.top/max)):0;const y=-18*p;const scale=1.18+0.27*p;img.style.transform='translate3d(0,'+y+'%,0) scale('+scale+')';caption.style.transform='translate3d(0,'+(-18*p)+'px,0)'}addEventListener('scroll',update,{passive:true});addEventListener('resize',update);update();</script></body></html>
