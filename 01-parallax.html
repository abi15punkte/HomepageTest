<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parallax</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="demo"><section class="parallax-track" id="parallax-track"><div class="parallax-sticky"><img id="photo" class="photo parallax-photo" src="IMG_0030.jpeg" alt=""><div class="caption"><p>01 / Parallax</p><h1>Bewegung<br>durch Tiefe</h1><p>Das Foto bleibt im Viewport. Der Zoom wiederholt sich mehrfach; Fokuspunkt ist das obere Viertel.</p></div></div></section></main><div class="hint">Scrollen</div><script>const track=document.querySelector('#parallax-track');const img=document.querySelector('#photo');const caption=document.querySelector('.caption');function update(){const max=track.offsetHeight-innerHeight;const rect=track.getBoundingClientRect();const p=max>0?Math.min(1,Math.max(0,-rect.top/max)):0;const cycles=4;const t=p*cycles;const local=t-Math.floor(t);const eased=local<.5?2*local*local:1-Math.pow(-2*local+2,2)/2;const scale=1.16+0.34*eased;const y=-20*eased;img.style.transform='translate3d(0,'+y+'%,0) scale('+scale+')';caption.style.transform='translate3d(0,'+(-14*eased)+'px,0)'}addEventListener('scroll',update,{passive:true});addEventListener('resize',update);update();</script></body></html>
