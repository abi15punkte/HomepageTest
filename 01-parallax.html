<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parallax</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="demo"><section class="parallax-track" id="parallax-track"><div class="parallax-sticky"><img id="photo" class="photo parallax-photo" src="IMG_0030.jpeg" alt=""><div class="caption"><p>01 / Parallax</p><h1>Bewegung<br>durch Tiefe</h1><p>Das Foto bleibt im Viewport. Durchgehende Kamerafahrt auf den Pixel-Zielpunkt 2120 / 1045, bis 10× Zoom.</p></div></div></section></main><div class="hint">Scrollen</div><script>
const track=document.querySelector('#parallax-track');
const img=document.querySelector('#photo');
const caption=document.querySelector('.caption');

const TARGET_X_PX=2120;
const TARGET_Y_PX=1045;
const TARGET_SCALE=10;
const START_SCALE=1.15;

function ease(t){
  return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
}

function update(){
  if(!img.naturalWidth || !img.naturalHeight) return;

  const vw=innerWidth;
  const vh=innerHeight;
  const coverScale=Math.max(vw/img.naturalWidth,vh/img.naturalHeight);
  const baseW=img.naturalWidth*coverScale;
  const baseH=img.naturalHeight*coverScale;

  const baseX=(vw-baseW)/2;
  const baseY=(vh-baseH)/2;

  const max=Math.max(1,track.offsetHeight-innerHeight);
  const rect=track.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,-rect.top/max));
  const e=ease(p);

  const scale=START_SCALE+(TARGET_SCALE-START_SCALE)*e;

  const finalX=vw/2-(TARGET_X_PX*coverScale*TARGET_SCALE);
  const finalY=vh/2-(TARGET_Y_PX*coverScale*TARGET_SCALE);

  const x=baseX+(finalX-baseX)*e;
  const y=baseY+(finalY-baseY)*e;

  img.style.width=baseW+'px';
  img.style.height=baseH+'px';
  img.style.left=x+'px';
  img.style.top=y+'px';
  img.style.transform='scale('+scale+')';

  caption.style.transform='translate3d(0,'+(-20*p)+'px,0)';
}

addEventListener('scroll',update,{passive:true});
addEventListener('resize',update);
img.addEventListener('load',update);
update();
</script></body></html>
