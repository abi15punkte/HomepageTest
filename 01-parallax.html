<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parallax</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="demo"><section class="stage" id="stage"><img id="photo" class="photo" src="IMG_0030.jpeg" alt=""><div class="caption"><p>01 / Parallax</p><h1>Bewegung<br>durch Tiefe</h1><p>Beim Scrollen verschiebt sich das Foto leicht gegen die Textbewegung.</p></div></section><section class="section"><h2>Der Effekt lebt von kleinen Geschwindigkeitsunterschieden.</h2></section></main><div class="hint">Scrollen</div><script>const img=document.querySelector('#photo');addEventListener('scroll',()=>{const y=scrollY;img.style.transform='scale(1.12) translateY('+y*.12+'px)'},{passive:true});</script></body></html>
