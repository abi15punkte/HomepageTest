<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parallax</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="back" href="index.html">← Übersicht</a>
<main class="demo">
  <section class="parallax-track" id="parallax-track">
    <div class="parallax-sticky">
      <div class="parallax-camera" id="camera">
        <img id="photo" class="photo parallax-photo" src="IMG_0030.jpeg" alt="">
      </div>
      <div class="caption">
        <p>01 / Parallax</p>
        <h1>Bewegung<br>durch Tiefe</h1>
        <p>Ein langer, kontinuierlicher Zoom auf einen frei definierten Bildpunkt.</p>
      </div>
    </div>
  </section>
</main>
<div class="hint">Scrollen</div>
<script>
const track=document.querySelector('#parallax-track');
const camera=document.querySelector('#camera');
const img=document.querySelector('#photo');
const caption=document.querySelector('.caption');

const TARGET_X_PX=2120;
const TARGET_Y_PX=1045;
const START_SCALE=1.15;
const TARGET_SCALE=10;

function ease(t){
  return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
}

function update(){
  if(!img.naturalWidth || !img.naturalHeight) return;

  const vw=innerWidth;
  const vh=innerHeight;
  const coverScale=Math.max(vw/img.naturalWidth,vh/img.naturalHeight);
  const renderedW=img.naturalWidth*coverScale;
  const renderedH=img.naturalHeight*coverScale;
  const cropX=(vw-renderedW)/2;
  const cropY=(vh-renderedH)/2;

  const targetXPercent=TARGET_X_PX/img.naturalWidth*100;
  const targetYPercent=TARGET_Y_PX/img.naturalHeight*100;

  img.style.transformOrigin=targetXPercent+'% '+targetYPercent+'%';

  const targetScreenX=cropX+(TARGET_X_PX*coverScale);
  const targetScreenY=cropY+(TARGET_Y_PX*coverScale);

  const max=Math.max(1,track.offsetHeight-innerHeight);
  const rect=track.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,-rect.top/max));
  const e=ease(p);

  const scale=START_SCALE+(TARGET_SCALE-START_SCALE)*e;
  const tx=(vw/2-targetScreenX)*e;
  const ty=(vh/2-targetScreenY)*e;

  camera.style.transform='translate3d('+tx+'px,'+ty+'px,0)';
  img.style.transform='scale('+scale+')';
  caption.style.transform='translate3d(0,'+(-20*p)+'px,0)';
}

addEventListener('scroll',update,{passive:true});
addEventListener('resize',update);
img.addEventListener('load',update);
update();
</script>
</body>
</html>
