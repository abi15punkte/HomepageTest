<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foto Reveal</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="demo"><section class="reveal-track" id="reveal-track"><div class="reveal-sticky"><div class="reveal-wrap"><img class="photo reveal-base" src="IMG_0030.jpeg" alt=""><img id="overlay" class="photo reveal-overlay" src="IMG_0030.jpeg" alt=""></div></div></section></main><div class="hint">Scrollen</div><script>const track=document.querySelector('#reveal-track');const overlay=document.querySelector('#overlay');function update(){const max=track.offsetHeight-innerHeight;const rect=track.getBoundingClientRect();const p=max>0?Math.min(1,Math.max(0,-rect.top/max)):0;const cycles=4;const t=p*cycles;const local=t-Math.floor(t);const eased=local<.5?2*local*local:1-Math.pow(-2*local+2,2)/2;const size=4+eased*118;overlay.style.clipPath='circle('+size+'% at 50% 25%)';overlay.style.transform='scale('+(1.30+0.18*eased)+')'}addEventListener('scroll',update,{passive:true});addEventListener('resize',update);update();</script></body></html>
