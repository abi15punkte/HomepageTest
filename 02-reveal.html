<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foto Reveal</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="demo"><section class="section" style="height:100vh"><div class="reveal-wrap"><img class="photo" src="IMG_0030.jpeg" alt=""><img id="overlay" class="photo reveal-overlay" src="IMG_0030.jpeg" alt=""></div></section><section class="section"><h1>Masking</h1></section></main><div class="hint">Scrollen</div><script>const o=document.querySelector('#overlay');addEventListener('scroll',()=>{const p=Math.min(100,Math.max(0,(scrollY/innerHeight)*100));o.style.clipPath='circle('+p*.72+'% at 50% 50%)'},{passive:true});</script></body></html>
