<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foto Reveal</title><link rel="stylesheet" href="style.css"></head><body><a class="back" href="index.html">← Übersicht</a><main class="demo"><section class="reveal-track" id="reveal-track"><div class="reveal-sticky"><div class="reveal-wrap"><img class="photo reveal-base" src="IMG_0030.jpeg" alt=""><img id="overlay" class="photo reveal-overlay" src="IMG_0030.jpeg" alt=""></div></div></section><section class="section"><h1>Masking</h1></section></main><div class="hint">Scrollen</div><script>const track=document.querySelector('#reveal-track');const overlay=document.querySelector('#overlay');function update(){const max=track.offsetHeight-innerHeight;const rect=track.getBoundingClientRect();const p=max>0?Math.min(1,Math.max(0,-rect.top/max)):0;const size=4+p*120;overlay.style.clipPath='circle('+size+'% at 50% 50%)'}addEventListener('scroll',update,{passive:true});addEventListener('resize',update);update();</script></body></html>
